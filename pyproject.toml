[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "toolpair"
version = "0.1.0"
description = "Check, repair and trim LLM chat histories without ever separating a tool call from its result (OpenAI & Anthropic formats)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Akash Vashisht" }]
keywords = ["llm", "openai", "anthropic", "claude", "tool-calling", "function-calling", "agents", "context-window", "chat-history"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Libraries",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-cov>=4", "ruff>=0.5", "mypy>=1.8"]

[project.scripts]
toolpair = "toolpair.cli:main"

[project.urls]
Homepage = "https://github.com/YOUR_GITHUB_USERNAME/toolpair"
Issues = "https://github.com/YOUR_GITHUB_USERNAME/toolpair/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
toolpair = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]

[tool.ruff]
line-length = 110
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["UP006", "UP007", "UP035", "UP045"]  # keep typing.List/Optional for 3.9 readability

[tool.mypy]
python_version = "3.9"
strict = true
files = ["src/toolpair"]
